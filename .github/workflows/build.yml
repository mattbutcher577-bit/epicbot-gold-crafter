name: Build EpicBot Gold Crafter

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Gold Crafter
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Clone official EpicBot script template
        run: |
          git clone --depth 1 https://gitlab.epicbot.com/epicbot-public/epicbot-script-template.git .epicbot-template

      - name: Inject Gold Crafter source
        shell: bash
        run: |
          set -euo pipefail

          JAVA_DIR=""
          while IFS= read -r d; do
            if grep -R -q -E "ScriptManifest|LoopScript|TreeScript" "$d" 2>/dev/null; then
              JAVA_DIR="$d"
              break
            fi
          done < <(find .epicbot-template -type d -path "*/src/main/java")

          if [ -z "$JAVA_DIR" ]; then
            JAVA_DIR="$(find .epicbot-template -type d -path "*/src/main/java" | head -n 1)"
          fi

          if [ -z "$JAVA_DIR" ]; then
            echo "No src/main/java directory found in EpicBot template"
            exit 1
          fi

          echo "Using template source directory: $JAVA_DIR"

          find "$JAVA_DIR" -type f -name "*.java" -delete
          mkdir -p "$JAVA_DIR/com/goldcrafter"
          cp src/main/java/com/goldcrafter/GoldCrafter.java "$JAVA_DIR/com/goldcrafter/GoldCrafter.java"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd .epicbot-template
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Collect JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -t JARS < <(
            find .epicbot-template -type f -path "*/build/libs/*.jar" \
              ! -name "*sources*" \
              ! -name "*javadoc*" \
              ! -name "*plain*"
          )

          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "Build completed but no script JAR was found"
            exit 1
          fi

          printf '%s\n' "${JARS[@]}"
          cp "${JARS[-1]}" release/GoldCrafter.jar

      - name: Upload Gold Crafter JAR
        uses: actions/upload-artifact@v4
        with:
          name: GoldCrafter
          path: release/GoldCrafter.jar
